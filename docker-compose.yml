services:
  postgres:
    image: postgres:16-alpine
    container_name: emailauto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emailauto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emailauto}
      POSTGRES_DB: ${POSTGRES_DB:-emailauto}
    # Bound to localhost (127.0.0.1) so database is never exposed to LAN or external networks
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emailauto} -d ${POSTGRES_DB:-emailauto}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: emailauto-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-emailauto}:${POSTGRES_PASSWORD:-emailauto}@postgres:5432/${POSTGRES_DB:-emailauto}?sslmode=disable
      PORT: ${SERVER_PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-development}
      MIGRATE_ON_STARTUP: "true"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/auth/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      WORKER_URL: ${WORKER_URL:-http://host.docker.internal:3001}
      UPLOAD_DIR: /app/uploads
    # Bound to localhost (127.0.0.1) for local access
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    volumes:
      - server_uploads:/app/uploads

volumes:
  postgres_data:
  server_uploads:
